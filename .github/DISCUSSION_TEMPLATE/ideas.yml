title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, missing or slow today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should VeltrixOS or VPM do?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - VPM
        - Package recipes
        - Kernel / boot
        - ISO / installer
        - Docs / tooling
        - Other
