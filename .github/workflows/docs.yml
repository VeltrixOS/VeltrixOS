name: Docs

on:
  push:
    branches: [main]
    paths: ["**.md", ".markdownlint-cli2.yaml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**.md", ".markdownlint-cli2.yaml", ".github/workflows/docs.yml"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          globs: "**/*.md"

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Rate-limited (429) answers are accepted. The advisory form needs a login.
          args: >-
            --no-progress
            --accept 200,206,429
            --max-retries 3
            --retry-wait-time 10
            --timeout 30
            --exclude 'security/advisories/new'
            './**/*.md'
          fail: true
